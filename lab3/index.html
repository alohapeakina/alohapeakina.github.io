<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <form id ="signupForm" action="welcome.html">
        <h1> Sign Up </h1>

        <div class="form-group" id="personalInformation">
            <div class="row">
                <label for="fName" class="col-sm-2 col-form-label">First Name</label>
                <div class="col-auto">
                    <input type="text" class="form-control" id="fName" placeholder="First Name">
                </div>
            </div>
            <div class="row">
                <label for="lName" class="col-sm-2 col-form-label">Last Name</label>
                <div class="col-auto">
                    <input type="text" class="form-control" id="lName" placeholder="Last Name">
                </div>
            </div>
            <div class="row">
                <legend class="col-form-label col-sm-2 pt-0">Gender</legend>
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderM" value="m" checked>
                        <label class="form-check-label" for="genderM">Male</label>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
                        <label class="form-check-label" for="genderF">Female</label>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderNb" value="nb">
                        <label class="form-check-label" for="genderNb">Non-binary</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group" id="location">
            <div class="row">
                <label for="zip" class="col-sm-2 col-form-label">Zip Code</label>
                <div class="col-auto">
                    <input type="text" class="form-control" id="zip" name="zip" placeholder="Zip Code">
                </div>
            </div>
            <div class="row">
                <label for="city" class="col-sm-2 col-form-label">City</label>
                <div class="col-auto">
                    <span id="city"></span>
                </div>
            </div>
            <div class="row">
                <label for="latitude" class="col-sm-2 col-form-label">Latitude</label>
                <div class="col-auto">
                    <span id="latitude"></span>
                </div>
            </div>
            <div class="row">
                <label for="longitude" class="col-sm-2 col-form-label">Longitude</label>
                <div class="col-auto">
                    <span id="longitude"></span>
                </div>
            </div>

            <div class="row">
                <label for="state" class="col-sm-2 col-form-label">State</label>
                <div class="col-auto">
                    <select class="form-control" id="state" name="state"></select>
                </div>
            </div>
            <div class="row">
                <label for="county" class="col-sm-2 col-form-label">County</label>
                <div class="col-auto">
                    <select class="form-control" id="county" name="county"></select>
                </div>
            </div>
        </div>

        <div class="form-group" id="accountInformation">
            <div class="row">
                <label for="username" class="col-sm-2 col-form-label">Desired Username</label>
                <div class="col-auto">
                    <input type="text" class="form-control" id="username" placeholder="Username">
                    <span id="usernameError"></span>
                </div>
            </div>
            <div class="row">
                <label for="password" class="col-sm-2 col-form-label">Password</label>
                <div class="col-auto">
                    <input type="password" class="form-control" id="password" placeholder="Password">
                    <span id="suggestedPwd"></span>
                </div>
            </div>
            <div class="row">
                <label for="passwordCheck" class="col-sm-2 col-form-label">Type Password Again</label>
                <div class="col-auto">
                    <input type="password" class="form-control" id="passwordCheck">
                    <span id="passwordError"></span>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Sign up!</button>
    </form>
    <script src="js/script.js"></script>
</body>
</html>
