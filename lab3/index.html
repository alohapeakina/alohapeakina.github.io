<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <form id ="signupForm" action="welcome.html">
        <header>
            <h1>Sign Up</h1>
            <p class="text-center small">You know you want to join the thing</p>
        </header>

        <div class="form-group" id="personalInformation">
            <div class="row">
                <label for="fName" class="col-sm-4 col-form-label">First Name</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="fName" placeholder="First Name">
                    <div class="invalid-feedback">First name is required</div>
                </div>
            </div>
            <div class="row">
                <label for="lName" class="col-sm-4 col-form-label">Last Name</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="lName" placeholder="Last Name">
                    <div class="invalid-feedback">Last name is required</div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label class="col-sm-4 col-form-label text-sm-end">Gender</label>
                    <div class="col-sm-8 d-flex gap-3"> <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderM" value="m">
                        <label class="form-check-label" for="genderM">Male</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
                        <label class="form-check-label" for="genderF">Female</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="genderNb" value="nb">
                        <label class="form-check-label" for="genderNb">Non-binary</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group" id="location">
            <div class="row">
                <label for="zip" class="col-sm-4 col-form-label">Zip Code</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="zip" name="zip" placeholder="Zip Code">
                    <div class="invalid-feedback" id="invalidZip" name="invalidZip">Please provide a valid zip</div>
                </div>
            </div>
            <div class="row mb-2">
                <label for="city" class="col-sm-4 col-form-label">City</label>
                <div class="col-sm-8">
                     <input type="text" readonly class="form-control-plaintext fw-bold" id="city" value="">
                </div>
            </div>
            <div class="row mb-2">
                <label for="latitude" class="col-sm-4 col-form-label">Latitude</label>
                <div class="col-sm-8">
                     <input type="text" readonly class="form-control-plaintext fw-bold" id="latitude" value="">
                </div>
            </div>
            <div class="row">
                <label for="longitude" class="col-sm-4 col-form-label">Longitude</label>
                <div class="col-sm-8">
                     <input type="text" readonly class="form-control-plaintext fw-bold" id="longitude" value="">
                </div>
            </div>

            <div class="row">
                <label for="state" class="col-sm-4 col-form-label">State</label>
                <div class="col-sm-8">
                    <select class="form-control" id="state" name="state"></select>
                </div>
            </div>
            <div class="row">
                <label for="county" class="col-sm-4 col-form-label">County</label>
                <div class="col-sm-8">
                    <select class="form-control" id="county" name="county"></select>
                </div>
            </div>
        </div>

        <div class="form-group" id="accountInformation">
            <div class="row">
                <label for="username" class="col-sm-4 col-form-label">Desired Username</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="username" placeholder="Username">
                    <div class="invalid-feedback" id="usernameError">Username is required</div>
                    <div class="valid-feedback" id="usernameSuccess">Username is available!</div>
                </div>
            </div>
            <div class="row mb-3">
                <label for="password" class="col-sm-4 col-form-label">Password</label>
                <div class="col-sm-8">
                        <input type="password" class="form-control me-2 flex-shrink-0" id="password" placeholder="Password">
                         <div id="suggestedPwd" class="col-auto small text-muted mt-1"></div>
                        <div class="invalid-feedback" id="passwordError">Password must be 6 characters</div>
                        <div class="valid-feedback"></div>
                </div>
            </div>
            <div class="row">
                <label for="passwordCheck" class="col-sm-4 col-form-label text-nowrap">Type Password Again</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" id="passwordCheck">
                    <div class="invalid-feedback" id="passwordCheckError">Passwords do not match</div>
                    <div class="valid-feedback"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-4"></div>
            <div class="col-sm-8 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary w-50 py-2" id="submitBtn">Create Account</button>
            </div>
        </div>

    </form>
    <footer>
        <hr>
        CST336 Internet Programming. 2026&copy; Lee <br>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
