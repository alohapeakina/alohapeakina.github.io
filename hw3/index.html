<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Booster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"> -->
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Mood Booster</h1>
    </header>

    <div class="row">
        <div class="col-sm-12">
            <h3>Dog Facts</h3>
            <label for="dogFactLimit">Number of facts</label>
            <input type="number" id="dogFactLimit" placeholder="Enter number">
            <div class="invalid-feedback">Number must be between 1-5!</div>
            <button class="btn btn-primary w-20" id="randomDogFact">Random Dog Fact</button>
        </div>
        <ul id="dog-fact-list">Click the button to get up to 5 dog facts!</ul>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <h3>Cat Facts</h3>
            <label for="catFactLimit">Number of facts</label>
            <input type="number" id="catFactLimit" placeholder="Enter number">
            <div class="invalid-feedback">Number must be between 1-5!</div>
            <button class="btn btn-primary w-20" id="randomCatFacts">Get Facts</button>
        </div>
        <ul id="cat-fact-list">Click the button to get up to 5 cat facts!</ul>
    </div>

    <br>

    <div class="row">
        <div class="col-sm-4">
            <button class="btn btn-primary w-20" id="getDogImage">Random Dog Picture</button>
            <p id="breedCaption" class="breed-caption"></p>
        </div>
        <div class="col-sm-8">
            <img id="dogImage" alt="Image of dog">
        </div>
    </div>

    <div class="row">
        <div class="col-sm-4">
            <button class="btn btn-primary w-20" id="getCatImage">Random Cat Picture</button>
        </div>
        <div class="col-sm-8">
            <img id="catImage" alt="Image of cat">
        </div>
    </div>



    <footer>
        <hr>
        CST336 Internet Programming. 2026&copy; Lee <br>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
