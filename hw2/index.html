<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Geography Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <h1>US Geography Quiz</h1>

    <form id="test-area">

        <div class="card mb-4 shadow-sm">
            <div class="question-card">
                <h5 class="question-copy">T/F California is the largest state by land mass</h5>
                <div class="responses">
                    <input class="form-check-input" type="radio" name="q1" id="q1a1" value="True">
                    <label class="form-check-label" for="q1a1">True</label>
                </div>
                <div class="responses">
                    <input class="form-check-input" type="radio" name="q1" id="q1a2" value="False">
                    <label class="form-check-label" for="q1a2">False</label>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="question-card">
                <h5 class="question-copy">What is the capital of California?</h5>
                <div class="responses">
                    <div class="responses">
                    <input class="form-check-input" type="checkbox" name="q2" id="q2a1" value="San Diego">
                    <label class="form-check-label" for="q2a1">San Diego</label> <br>
                    </div>
                    <div class="responses">
                    <input class="form-check-input" type="checkbox" name="q2" id="q2a2" value="Los Angeles">
                    <label class="form-check-label" for="q2a2">Los Angeles</label>
                    </div>
                    <div class="responses">
                    <input class="form-check-input" type="checkbox" name="q2" id="q2a3" value="Sacramento">
                    <label class="form-check-label" for="q2a3">Sacramento</label> <br>
                    </div>
                    <div class="responses">
                    <input class="form-check-input" type="checkbox" name="q2" id="q2a4" value="San Francisco">
                    <label class="form-check-label" for="q2a4">San Francisco</label>
                    </div>
                </div>
            </div>
        </div>

        
        <div class="text-end">
        <!-- <button type="submit" class="btn btn-primary btn-lg px-5" id="nextBtn">Next Question</button> -->
        <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">Submit Quiz</button>
        </div>

    </form>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
